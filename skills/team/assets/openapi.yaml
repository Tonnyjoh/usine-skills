openapi: 3.0.3
info:
  title: {{PROJECT_NAME}} API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths: {}
components:
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable error code
        message:
          type: string
          description: Human-readable message
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }
