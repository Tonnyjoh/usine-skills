openapi: 3.0.3
info:
  title: {{NOM_DU_PROJET}} API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths: {}
components:
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Code d'erreur stable, lisible par machine
        message:
          type: string
          description: Message lisible par un humain
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }
